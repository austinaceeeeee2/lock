<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心情日记墙</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="style.css?v=20251225-5">
</head>
<body>

<div class="container">
    <header>
        <h1>心情日记墙</h1>
        <p>记录当下，分享此刻</p>
        <button id="partyBtn" class="party-btn">🎵 开启派对模式 (Phonk)</button>
    </header>

    <div class="input-area">
        <textarea id="diaryInput" placeholder="今天发生了什么？写下来吧..."></textarea>
        <div class="controls">
            <div class="privacy-toggle">
                <!-- 预留隐私设置功能 -->
                <span>🌏 公开可见</span>
            </div>
            <button id="postBtn" disabled>发布</button>
        </div>
    </div>

    <div id="feed" class="feed">
        <!-- 日记列表将在这里渲染 -->
    </div>
</div>

    <script src="script.js?v=20251225-5"></script>
</body>
</html>
